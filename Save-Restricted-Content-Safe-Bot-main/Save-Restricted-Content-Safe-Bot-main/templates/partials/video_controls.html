<div class="player-toolbar rounded-2xl border border-white/10 bg-slate-950/90 p-3 text-white shadow-2xl backdrop-blur-xl sm:p-4" data-player-controls>
    <div class="mb-3 flex items-center gap-3">
        <span class="min-w-12 text-xs tabular-nums text-slate-300" data-player-time-current>0:00</span>
        <input type="range" min="0" max="1000" value="0" aria-label="Seek video" data-player-seek class="min-w-0 flex-1 accent-cyan-400">
        <span class="min-w-12 text-right text-xs tabular-nums text-slate-300" data-player-time-duration>0:00</span>
    </div>
    <div class="flex flex-wrap items-center gap-2">
        <button type="button" data-player-action="toggle" aria-label="Play" title="Play or pause (Space)" class="player-control-button">
            <i class="fas fa-play" aria-hidden="true"></i>
        </button>
        <button type="button" data-player-action="seek-back" aria-label="Back 10 seconds" title="Back 10 seconds (Left arrow)" class="player-control-button">
            <i class="fas fa-rotate-left" aria-hidden="true"></i><span class="text-xs">10</span>
        </button>
        <button type="button" data-player-action="seek-forward" aria-label="Forward 10 seconds" title="Forward 10 seconds (Right arrow)" class="player-control-button">
            <i class="fas fa-rotate-right" aria-hidden="true"></i><span class="text-xs">10</span>
        </button>
        <button type="button" data-player-action="mute" aria-label="Mute" title="Mute (M)" class="player-control-button">
            <i class="fas fa-volume-high" aria-hidden="true"></i>
        </button>
        <input type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" data-player-volume class="w-20 accent-cyan-400">
        <label class="ml-1 flex items-center gap-2 text-xs text-slate-300">
            <span>Speed</span>
            <select aria-label="Playback speed" data-player-speed class="rounded-lg border border-white/10 bg-slate-800 px-2 py-1.5 text-white">
                <option value="0.25">0.25x</option>
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1" selected>1x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2x</option>
                <option value="3">3x</option>
                <option value="4">4x</option>
            </select>
        </label>
        <button type="button" data-player-action="loop" aria-label="Enable loop" aria-pressed="false" title="Loop" class="player-control-button">
            <i class="fas fa-repeat" aria-hidden="true"></i>
        </button>
        {% if video.subtitles %}
        <button type="button" data-player-action="captions" aria-label="Toggle subtitles" aria-pressed="true" title="Toggle subtitles (C)" class="player-control-button">
            <i class="fas fa-closed-captioning" aria-hidden="true"></i>
        </button>
        {% endif %}
        {% if video.quality_sources %}
        <label class="ml-1 flex items-center gap-2 text-xs text-slate-300">
            <span>Quality</span>
            <select aria-label="Video quality" data-player-quality class="max-w-32 rounded-lg border border-white/10 bg-slate-800 px-2 py-1.5 text-white">
                <option value="{{ video.stream_url }}" selected>Original</option>
                {% for quality, source in video.quality_sources.items() %}
                <option value="{{ source }}">{{ quality }}</option>
                {% endfor %}
            </select>
        </label>
        {% endif %}
        <span class="flex-1"></span>
        <button type="button" data-player-action="pip" aria-label="Picture in picture" title="Picture in picture" class="player-control-button">
            <i class="fas fa-clone" aria-hidden="true"></i>
        </button>
        <button type="button" data-player-action="fullscreen" aria-label="Fullscreen" title="Fullscreen (F)" class="player-control-button">
            <i class="fas fa-expand" aria-hidden="true"></i>
        </button>
        <a href="{{ video.stream_url }}" target="_blank" rel="noopener" aria-label="Open video source" title="Open source" class="player-control-button">
            <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i>
        </a>
        <a href="{{ video.stream_url }}{% if '?' in video.stream_url %}&{% else %}?{% endif %}download=1" target="_blank" rel="noopener" aria-label="Download video" title="Download" class="player-control-button">
            <i class="fas fa-download" aria-hidden="true"></i>
        </a>
        <button type="button" data-player-action="copy-link" aria-label="Copy player link" title="Copy player link" class="player-control-button">
            <i class="fas fa-link" aria-hidden="true"></i>
        </button>
    </div>
    <p class="mt-2 min-h-4 text-xs text-rose-300" role="status" aria-live="polite" data-player-message></p>
</div>
